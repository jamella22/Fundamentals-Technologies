    top: 12px;
    right: 12px;
    display: flex;
    gap: 8px;

    height: 16px;

const UNPINNED = [
  {
    id: "teken", region: "sc", name: "Текен дере",
    place: "с. Болярино, между Раковски и Белозем. Около 85 дка",
    kind: "Частен водоем, ползва се и за състезания.",
    fish: "Шаран.",
    fee: "Таксата не е в отворените страници.",
    rules: "В отворените карти няма еднозначно именувана точка, затова маркерът липсва.",
    stay: "Питай стопанина.",
    phone: "",
    bait: "Бойли."
  },
  {
    id: "voden", region: "sc", name: "Воден свят",
    place: "яз. № 8, на 1 км от Хисаря",
    kind: "Къмпинг с бунгала и 15 кея. Платен любителски риболов, не див язовир.",
    fish: "Шаран, каракуда, сом, толстолоб.",
    fee: "В отзив на сайта от 25.03.2024 г.: риболов 15 лв. за посещение, бунгало за двама 50 лв., лукс за трима 80 лв. Каракудата не се плаща. Това е отзив, не таблото на рецепцията.",

    stay: "Бунгала с климатик. Това е организиран къмпинг.",

    link: "https://voden.club/"
  },
  {
    id: "ayazmo", region: "se", name: "Аязмо",
    place: "над кв. Меден рудник, Бургас",
    kind: "Малък водоем сред няколко съседни езера. Точната чаша не е отделена с име в картата.",
    fish: "Много дребни шаранчета.",
    fee: "Отделна такса в източниците няма.",
    rules: "Маркерът е пропуснат, за да не сочи съседно езеро.",

    phone: "",
    bait: "Червей и царевица за дребния шаран."
  }

const map = L.map("map", { zoomControl: true }).setView([42.75, 25.4], 7);
const osm = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: "&copy; OpenStreetMap"
});
const sat = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
  maxZoom: 19,
  attribution: "Esri, Maxar, Earthstar"
});
osm.addTo(map);

const markers = {};
let activeRegion = "all";
let activeId = null;
let satellite = false;

function icon(color, on) {
  return L.divIcon({
    className: "pin" + (on ? " on" : ""),
    html: `<span style="background:${color}"></span>`,
    iconSize: on ? [24, 24] : [20, 20],
    iconAnchor: on ? [12, 22] : [10, 18],
    popupAnchor: [0, -16]
  });
}

function phones(item) {
  return [item.phone, item.phone2].filter(Boolean);
}

function cardHtml(item) {
  const tel = phones(item).map(p => `<a href="tel:${p.replace(/\s/g, "")}">${p}</a>`).join(" · ");
  const g = item.lat
    ? `<a target="_blank" rel="noopener" href="https://www.google.com/maps?q=${item.lat},${item.lon}">Google Maps</a>`
    : "";
  const site = item.link ? ` · <a target="_blank" rel="noopener" href="${item.link}">Сайт</a>` : "";
  return `<div class="pop">
    <h3>${item.name}</h3>
    <div class="meta">${regionName[item.region]} · ${item.place}</div>
    <p>${item.kind}</p>
    <p><b>Риба.</b> ${item.fish}</p>
    <p><b>Такса.</b> ${item.fee}</p>
    <p><b>Правила.</b> ${item.rules}</p>
    <p><b>Стръв.</b> ${item.bait}</p>
    <p><b>Престой.</b> ${item.stay}</p>
    <p>${tel ? "<b>Телефон.</b> " + tel + "<br>" : ""}<span class="tag">${item.pin || "Без проверена точка"}</span></p>
    <p>${g}${site}</p>
  </div>`;
}

LAKES.forEach(lake => {
  const marker = L.marker([lake.lat, lake.lon], { icon: icon(regionColor[lake.region], false) });
  marker.bindPopup(cardHtml(lake), { maxWidth: 320 });
  marker.on("click", () => setActive(lake.id, false));
  markers[lake.id] = marker;
});

function visibleLakes() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  return LAKES.filter(l => {
    if (activeRegion !== "all" && l.region !== activeRegion) return false;
    if (!q) return true;
    return [l.name, l.place, l.fish, l.kind, regionName[l.region]].join(" ").toLowerCase().includes(q);
  });
}

function visibleUnpinned() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  return UNPINNED.filter(l => {
    if (activeRegion !== "all" && l.region !== activeRegion) return false;
    if (!q) return true;
    return [l.name, l.place, l.fish, regionName[l.region]].join(" ").toLowerCase().includes(q);
  });
}

function syncMarkers() {
  const ids = new Set(visibleLakes().map(l => l.id));
  LAKES.forEach(l => {
    const m = markers[l.id];
    if (ids.has(l.id)) {
      if (!map.hasLayer(m)) m.addTo(map);
    } else if (map.hasLayer(m)) {
      map.removeLayer(m);
    }
    m.setIcon(icon(regionColor[l.region], l.id === activeId));
  });
}

function renderList() {
  const list = document.getElementById("list");
  list.innerHTML = "";
  visibleLakes().forEach(l => {
    const li = document.createElement("li");
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "item" + (l.id === activeId ? " on" : "");
    btn.innerHTML = `<i class="dot" style="background:${regionColor[l.region]}"></i><strong></strong><span></span>`;
    btn.querySelector("strong").textContent = l.name;
    btn.querySelector("span").textContent = l.place;
    btn.addEventListener("click", () => {
      setActive(l.id, true);
      document.getElementById("side").classList.remove("open");
    });
    li.appendChild(btn);
    list.appendChild(li);
  });
  const loose = visibleUnpinned();
  if (loose.length) {
    const h = document.createElement("h2");
    h.textContent = "Без проверена точка";
    list.appendChild(h);
    loose.forEach(l => {
      const li = document.createElement("li");
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "item" + (l.id === activeId ? " on" : "");
      btn.innerHTML = `<i class="dot" style="background:${regionColor[l.region]}"></i><strong></strong><span></span>`;
      btn.querySelector("strong").textContent = l.name;
      btn.querySelector("span").textContent = "няма маркер · " + l.place;
      btn.addEventListener("click", () => {
        activeId = l.id;
        renderList();
      });
      li.appendChild(btn);
      if (l.id === activeId) {
        const box = document.createElement("div");
        box.className = "card";
        box.innerHTML = cardHtml(l);
        li.appendChild(box);
      }
      list.appendChild(li);
    });
  }
  if (!visibleLakes().length && !loose.length) {
    const li = document.createElement("li");
    li.className = "card miss";
    li.textContent = "Няма водоем по това търсене.";
    list.appendChild(li);
  }
}

function setActive(id, fly) {
  activeId = id;
  const lake = LAKES.find(l => l.id === id);
  syncMarkers();
  renderList();
  if (!lake) return;
  const marker = markers[id];
  if (fly) {
    map.flyTo([lake.lat, lake.lon], Math.max(map.getZoom(), 13), { duration: 0.6 });
  }
  marker.openPopup();
}

function fitVisible() {
  const pts = visibleLakes().map(l => [l.lat, l.lon]);
  if (!pts.length) {
    map.setView([42.75, 25.4], 7);
    return;
  }
  map.fitBounds(pts, { padding: [40, 40], maxZoom: 11 });
}

function renderFilters() {
  const box = document.getElementById("filters");
  box.innerHTML = "";
  REGIONS.forEach(r => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = r.name;
    b.dataset.region = r.id;
    if (r.id === activeRegion) {
      b.className = "on";
      b.style.background = r.id === "all" ? "#1c2430" : r.color;
    }
    b.addEventListener("click", () => {
      activeRegion = r.id;
      activeId = null;
      renderFilters();
      syncMarkers();
      renderList();
      fitVisible();
    });
    box.appendChild(b);
  });
}

document.getElementById("q").addEventListener("input", () => {
  syncMarkers();
  renderList();
});
document.getElementById("baseBtn").addEventListener("click", () => {
  satellite = !satellite;
  if (satellite) {
    map.removeLayer(osm);
    sat.addTo(map);
    document.getElementById("baseBtn").textContent = "Карта";
  } else {
    map.removeLayer(sat);
    osm.addTo(map);
    document.getElementById("baseBtn").textContent = "Сателит";
  }
});
document.getElementById("fitBtn").addEventListener("click", () => {
  activeRegion = "all";
  document.getElementById("q").value = "";
  renderFilters();
  syncMarkers();
  renderList();
  fitVisible();
});
document.getElementById("menuBtn").addEventListener("click", () => {
  document.getElementById("side").classList.toggle("open");
});

renderFilters();
syncMarkers();
renderList();
fitVisible();

if (location.hash) {
  const id = location.hash.slice(1);
  if (LAKES.some(l => l.id === id) || UNPINNED.some(l => l.id === id)) setActive(id, true);
}
</script>

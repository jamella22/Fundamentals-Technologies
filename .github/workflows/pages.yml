name: Deploy map pages
on:
  push:
    branches: [cursor/sport-lakes-map-e6a9, master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p _site/tools
          cp sportni-yazoviri.html relef.html ogosta-breg.html _site/
          cp tools/bulletin-latest.json _site/tools/
          printf '%s\n' '<!DOCTYPE html><meta charset="utf-8"><title>Спортни язовири</title>' \
            '<p><a href="sportni-yazoviri.html">Спортни язовири</a></p>' \
            '<p><a href="relef.html">Дълбочина / релеф</a></p>' \
            '<p><a href="ogosta-breg.html">Огоста бряг</a></p>' > _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
